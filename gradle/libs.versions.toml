[versions]
adaptive = "1.3.0"
agp = "9.4.1"
hiltCompiler = "2.60.1"
kotlin = "2.4.21"
ksp = "2.3.6"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
